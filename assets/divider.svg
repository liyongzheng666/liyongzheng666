<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="6" viewBox="0 0 1000 6" role="img" aria-label="divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7dcfff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7dcfff" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#bb9af7" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#7aa2f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="1000" height="2" rx="1" fill="#2f3352"/>
  <rect x="0" y="1.5" width="1000" height="3" rx="1.5" fill="url(#d)"/>
</svg>
