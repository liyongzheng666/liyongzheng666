<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Li Yongzheng - AI + CAD Kernel Algorithm Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="55%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#212338"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="45%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#292d47" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .f  { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif; }
    .mono { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, monospace; }

    .rise { opacity: 0; animation: rise 0.9s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform: translateY(0) } }

    .bar { animation: bar 1.4s cubic-bezier(.2,.7,.3,1) forwards; transform-origin: 62px 0; transform: scaleX(0); }
    @keyframes bar { to { transform: scaleX(1) } }

    .glow { animation: breathe 5.5s ease-in-out infinite; transform-origin: 778px 105px; }
    @keyframes breathe { 0%,100% { opacity:.55; transform: scale(.94) } 50% { opacity:1; transform: scale(1.06) } }

    .float { animation: float 6.5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

    .scan { animation: scan 3.4s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateY(0); opacity:0 } 12% { opacity:1 } 88% { opacity:1 } 100% { transform: translateY(178px); opacity:0 } }

    .front { stroke-dasharray: 420; animation: frontSeq 9s linear infinite; }
    @keyframes frontSeq { 0% { stroke-dashoffset:420; opacity:1 } 18% { stroke-dashoffset:0; opacity:1 } 93% { stroke-dashoffset:0; opacity:1 } 99%,100% { stroke-dashoffset:0; opacity:0 } }

    .back { stroke-dasharray: 420; animation: backSeq 9s linear infinite; }
    @keyframes backSeq { 0%,20% { stroke-dashoffset:420; opacity:0 } 22% { opacity:1 } 38% { stroke-dashoffset:0 } 93% { stroke-dashoffset:0; opacity:1 } 99%,100% { opacity:0 } }

    .edge { stroke-dasharray: 68; animation: edgeSeq 9s linear infinite; }
    @keyframes edgeSeq { 0%,20% { stroke-dashoffset:68; opacity:0 } 22% { opacity:1 } 40% { stroke-dashoffset:0 } 93% { stroke-dashoffset:0; opacity:1 } 99%,100% { opacity:0 } }

    .face { opacity:0; animation: faceSeq 9s ease-in-out infinite; }
    @keyframes faceSeq { 0%,40% { opacity:0 } 54% { opacity:1 } 93% { opacity:1 } 99%,100% { opacity:0 } }

    .fillet { opacity:0; animation: filletSeq 9s ease-in-out infinite; }
    @keyframes filletSeq { 0%,55% { opacity:0 } 63% { opacity:1 } 93% { opacity:1 } 99%,100% { opacity:0 } }

    .dim { opacity:0; animation: dimSeq 9s ease-in-out infinite; }
    @keyframes dimSeq { 0%,76% { opacity:0 } 83% { opacity:1 } 93% { opacity:1 } 99%,100% { opacity:0 } }

    .vtx { opacity:0; animation: vtxSeq 9s ease-in-out infinite; }
    @keyframes vtxSeq { 0%,40% { opacity:0 } 50% { opacity:1 } 93% { opacity:1 } 99%,100% { opacity:0 } }

    .lbl { opacity:0; }
    .l1 { animation: l1 9s linear infinite; }
    @keyframes l1 { 0% { opacity:0 } 3% { opacity:1 } 17% { opacity:1 } 21%,100% { opacity:0 } }
    .l2 { animation: l2 9s linear infinite; }
    @keyframes l2 { 0%,21% { opacity:0 } 25% { opacity:1 } 50% { opacity:1 } 54%,100% { opacity:0 } }
    .l3 { animation: l3 9s linear infinite; }
    @keyframes l3 { 0%,54% { opacity:0 } 58% { opacity:1 } 74% { opacity:1 } 78%,100% { opacity:0 } }
    .l4 { animation: l4 9s linear infinite; }
    @keyframes l4 { 0%,78% { opacity:0 } 82% { opacity:1 } 94% { opacity:1 } 98%,100% { opacity:0 } }

    .pill { opacity:0; animation: rise 0.8s cubic-bezier(.2,.7,.3,1) forwards; }
    .p1 { animation-delay: .55s } .p2 { animation-delay: .70s } .p3 { animation-delay: .85s } .p4 { animation-delay: 1.0s }
  </style>

  <rect width="1000" height="240" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="12" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="999" height="239" rx="12" fill="none" stroke="#2f3352"/>

  <!-- ============ 左侧文字 ============ -->
  <g class="f">
    <text class="rise" x="62" y="92" font-size="40" font-weight="700" fill="url(#nameGrad)">李永正 · Li Yongzheng</text>
    <rect class="bar" x="62" y="104" width="300" height="3" rx="1.5" fill="url(#underline)"/>
    <text class="rise" style="animation-delay:.15s" x="62" y="134" font-size="17" fill="#7aa2f7">AI + CAD 造型内核算法工程师</text>
    <text class="rise mono" style="animation-delay:.30s" x="62" y="158" font-size="11.5" letter-spacing="3.2" fill="#565f89">GEOMETRY KERNEL × AI AGENT</text>

    <g class="mono" font-size="11">
      <g class="pill p1"><rect x="62" y="176" width="56" height="26" rx="13" fill="#7dcfff" fill-opacity="0.12" stroke="#7dcfff" stroke-opacity="0.45"/><text x="90" y="193" text-anchor="middle" fill="#7dcfff">C++</text></g>
      <g class="pill p2"><rect x="126" y="176" width="70" height="26" rx="13" fill="#9ece6a" fill-opacity="0.12" stroke="#9ece6a" stroke-opacity="0.45"/><text x="161" y="193" text-anchor="middle" fill="#9ece6a">Python</text></g>
      <g class="pill p3"><rect x="204" y="176" width="66" height="26" rx="13" fill="#bb9af7" fill-opacity="0.12" stroke="#bb9af7" stroke-opacity="0.45"/><text x="237" y="193" text-anchor="middle" fill="#bb9af7">OCCT</text></g>
      <g class="pill p4"><rect x="278" y="176" width="62" height="26" rx="13" fill="#e0af68" fill-opacity="0.12" stroke="#e0af68" stroke-opacity="0.45"/><text x="309" y="193" text-anchor="middle" fill="#e0af68">Agent</text></g>
    </g>
  </g>

  <!-- ============ 右侧 CAD 建模动画 ============ -->
  <ellipse class="glow" cx="778" cy="105" rx="130" ry="105" fill="url(#glow)"/>

  <g class="float">
    <!-- 面（拉伸完成后淡入） -->
    <g class="face">
      <polygon points="690,80 810,80 865,40 745,40" fill="#7aa2f7" fill-opacity="0.20"/>
      <polygon points="810,170 865,130 865,40 810,80" fill="#7aa2f7" fill-opacity="0.13"/>
      <rect x="690" y="80" width="120" height="90" fill="#7aa2f7" fill-opacity="0.07"/>
    </g>

    <!-- 拉伸方向的四条棱 -->
    <g stroke="#7aa2f7" stroke-width="1.8" stroke-linecap="round" fill="none">
      <line class="edge" x1="690" y1="170" x2="745" y2="130"/>
      <line class="edge" x1="810" y1="170" x2="865" y2="130"/>
      <line class="edge" x1="810" y1="80"  x2="865" y2="40"/>
      <line class="edge" x1="690" y1="80"  x2="745" y2="40"/>
    </g>

    <!-- 背面轮廓 -->
    <path class="back" d="M745 130 H865 V40 H745 Z" fill="none" stroke="#7aa2f7" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- 正面草图轮廓 -->
    <path class="front" d="M690 170 H810 V80 H690 Z" fill="none" stroke="#7dcfff" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- 圆角高亮 -->
    <g class="fillet" stroke="#9ece6a" stroke-width="2.6" fill="none" stroke-linecap="round">
      <path d="M690 92 A12 12 0 0 1 702 80"/>
      <path d="M798 80 A12 12 0 0 1 810 92"/>
      <path d="M810 158 A12 12 0 0 1 798 170"/>
      <path d="M702 170 A12 12 0 0 1 690 158"/>
    </g>

    <!-- 顶点 -->
    <g class="vtx" fill="#bb9af7">
      <circle cx="690" cy="170" r="3"><animate attributeName="r" values="3;4.6;3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="170" r="3"><animate attributeName="r" values="3;4.6;3" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="80"  r="3"><animate attributeName="r" values="3;4.6;3" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="80"  r="3"><animate attributeName="r" values="3;4.6;3" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="865" cy="130" r="2.6"><animate attributeName="r" values="2.6;4;2.6" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="865" cy="40"  r="2.6"><animate attributeName="r" values="2.6;4;2.6" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="745" cy="40"  r="2.6"><animate attributeName="r" values="2.6;4;2.6" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="745" cy="130" r="2.6"><animate attributeName="r" values="2.6;4;2.6" dur="2.4s" begin="2.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- 尺寸标注 -->
    <g class="dim mono" stroke="#565f89" stroke-width="1" fill="none">
      <line x1="690" y1="192" x2="810" y2="192"/>
      <line x1="690" y1="187" x2="690" y2="197"/>
      <line x1="810" y1="187" x2="810" y2="197"/>
      <text x="750" y="185" text-anchor="middle" font-size="10" fill="#7c86ad" stroke="none">120.00</text>
    </g>
  </g>

  <!-- 扫描光带 -->
  <g class="scan"><rect x="655" y="22" width="250" height="2.5" fill="url(#scanGrad)"/></g>

  <!-- 阶段标签 -->
  <g class="mono" font-size="12" letter-spacing="2.6">
    <text class="lbl l1" x="655" y="216" fill="#7dcfff">01 · SKETCH 草图</text>
    <text class="lbl l2" x="655" y="216" fill="#7aa2f7">02 · EXTRUDE 拉伸</text>
    <text class="lbl l3" x="655" y="216" fill="#9ece6a">03 · FILLET 圆角</text>
    <text class="lbl l4" x="655" y="216" fill="#bb9af7">04 · SOLID 实体</text>
  </g>
</svg>
